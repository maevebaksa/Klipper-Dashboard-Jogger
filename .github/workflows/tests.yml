name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest requests pygame
      - run: python -m compileall -q jogger launch.py
      - run: python -m pytest -q
        env:
          PYTHONPATH: .
